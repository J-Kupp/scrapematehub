name: Build Worker Image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile.worker"
      - "requirements.txt"
      - "scraper.py"
      - "orchestrator.py"
      - "config.py"
      - "models.py"
      - "core/**"
      - "adapters/**"
      - "packaging.py"
      - "parse.py"
      - "cleaner.py"
      - "export.py"
      - "validate.py"
      - "ybm.py"
      - "shared_secrets.py"
      - ".github/workflows/build-worker.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ secrets.ECR_REPOSITORY }}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "${{ secrets.ECR_REPOSITORY }}"

      - name: Set image tags
        id: meta
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build worker image
        run: |
          docker build -f Dockerfile.worker -t "${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.sha_tag }}" -t "${{ steps.meta.outputs.image_uri }}:latest" .

      - name: Push worker image
        run: |
          docker push "${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.sha_tag }}"
          docker push "${{ steps.meta.outputs.image_uri }}:latest"
